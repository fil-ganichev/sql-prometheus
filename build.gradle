plugins {
    id 'java'
}

group = 'org.lokrusta'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.calcite:calcite-core:1.38.0'
    implementation 'org.apache.calcite:calcite-linq4j:1.38.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.testcontainers:testcontainers:1.21.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.register('stageDbeaver', Sync) {
    group = 'build'
    description = 'Copies the driver jar and its runtime libraries into build/dbeaver.'
    dependsOn tasks.named('jar')
    into layout.buildDirectory.dir('dbeaver')
    from tasks.named('jar', Jar).flatMap { it.archiveFile }
    from configurations.runtimeClasspath
}

def driverServices = layout.buildDirectory.dir('driver-services')

def mergeDriverServices = tasks.register('mergeDriverServices') {
    def runtimeClasspath = configurations.runtimeClasspath
    inputs.files(runtimeClasspath)
    inputs.dir(layout.projectDirectory.dir('src/main/resources/META-INF/services'))
    outputs.dir(driverServices)
    doLast {
        def dest = driverServices.get().asFile
        dest.deleteDir()
        dest.mkdirs()
        def lines = new LinkedHashMap<String, List<String>>()
        def absorb = { tree ->
            tree.matching { include 'META-INF/services/*' }.each { File service ->
                def collected = lines.computeIfAbsent(service.name) { new ArrayList<String>() }
                service.eachLine('UTF-8') { String line ->
                    def trimmed = line.trim()
                    if (trimmed && !trimmed.startsWith('#') && !collected.contains(trimmed)) {
                        collected.add(trimmed)
                    }
                }
            }
        }
        absorb(fileTree(layout.projectDirectory.dir('src/main/resources')))
        runtimeClasspath.files.each { File file ->
            absorb(file.isDirectory() ? fileTree(file) : zipTree(file))
        }
        lines.put('java.sql.Driver', ['org.lokrusta.sqlprometheus.driver.PrometheusDriver'])
        lines.each { name, values ->
            new File(dest, name).setText(values.join('\n') + '\n', 'UTF-8')
        }
    }
}

tasks.register('allJar', Jar) {
    group = 'build'
    description = 'Builds a single jar with the driver and its runtime libraries.'
    archiveClassifier = 'all'
    dependsOn mergeDriverServices
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/services/**', '**/module-info.class'
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { File file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
    into('META-INF/services') {
        from mergeDriverServices
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs(
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.nio=ALL-UNNAMED'
    )
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}
