apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: sql-prometheus
    uid: sql-prometheus
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://grafana-connector:8081
    jsonData:
      allowedHosts:
        - http://grafana-connector:8081

  - name: SQL Prometheus
    uid: sql-prometheus-plugin
    type: sqlprometheus-datasource
    access: direct
    jsonData:
      url: http://localhost:8081
